version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: relayx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-relayx}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - relayx_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-relayx}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  relayx_pg_data:
    name: relayx_pg_data
